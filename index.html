<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЗП Калькулятор</title>
    <style>
        :root {
            --primary-color: #004a99;
            --bg-color: #f4f6f9;
            --panel-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #dcdfe6;
            --success-color: #27ae60;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; box-sizing: border-box; }
        .calculator { max-width: 480px; margin: 0 auto; background: var(--panel-bg); padding: 20px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: var(--primary-color); margin-top: 0; margin-bottom: 20px; font-size: 20px; }
        
        .form-group { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        label { font-size: 14px; font-weight: 500; }
        input, select { width: 48%; padding: 9px 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; text-align: right; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--primary-color); outline: none; }

        .divider { border-top: 1px solid var(--border-color); margin: 18px 0; }
        
        .results-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .result-box { border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; text-align: center; background: #fafbfc; }
        .result-title { font-size: 12px; color: #7f8c8d; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
        .result-value { font-size: 18px; font-weight: bold; }
        
        .gross-result { color: var(--primary-color); }
        .net-result { color: var(--success-color); border-color: var(--success-color); background: #f0fbf5; }

        button { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #003773; }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Калькулятор ЗП</h2>
    
    <div class="form-group">
        <label>Місяць</label>
        <select id="monthSelect" onchange="calculateSalary()"></select>
    </div>

    <div class="form-group">
        <label>Основний оклад (zł)</label>
        <input type="number" id="baseSalary" value="5630" oninput="calculateSalary()">
    </div>

    <div class="form-group">
        <label>Стаж роботи</label>
        <select id="tenureSelect" onchange="calculateSalary()">
            <option value="0">менше 12 місяців</option>
            <option value="150">1 рік</option>
            <option value="300" selected>2+ роки</option>
        </select>
    </div>

    <div class="form-group">
        <label>Премія</label>
        <select id="bonusPctSelect" onchange="calculateSalary()">
            <option value="0">0%</option>
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="15" selected>15%</option>
        </select>
    </div>

    <div class="form-group">
        <label>Ранкові зміни</label>
        <input type="number" id="morningShifts" value="10" oninput="calculateSalary()">
    </div>

    <div class="form-group">
        <label>Нічні зміни</label>
        <input type="number" id="nightShifts" value="5" oninput="calculateSalary()">
    </div>

    <div class="form-group">
        <label>Робочі сб / нд (днів)</label>
        <input type="number" id="weekendDays" value="6" oninput="calculateSalary()">
    </div>

    <div class="form-group">
        <label>Надгодини (днів)</label>
        <input type="number" id="overtimeDays" value="3" oninput="calculateSalary()">
    </div>

    <div class="form-group">
        <label>Участь у PPK</label>
        <select id="ppkSelect" onchange="calculateSalary()">
            <option value="yes">Так</option>
            <option value="no" selected>Ні</option>
        </select>
    </div>

    <div class="form-group">
        <label>Додаткове страхування</label>
        <select id="insuranceSelect" onchange="calculateSalary()">
            <option value="yes" selected>Так</option>
            <option value="no">Ні</option>
        </select>
    </div>

    <button onclick="calculateSalary()">Розрахувати</button>

    <div class="divider"></div>

    <div class="results-panel">
        <div class="result-box">
            <div class="result-title">Брутто</div>
            <div class="result-value gross-result" id="grossResult">0.00 zł</div>
        </div>
        <div class="result-box">
            <div class="result-title">Нетто</div>
            <div class="result-value net-result" id="netResult">0.00 zł</div>
        </div>
    </div>
</div>

<script>
    const monthData = {
        "січень": 20, "лютий": 20, "березень": 22, "квітень": 21,
        "травень": 20, "червень": 21, "липень": 23, "серпень": 20,
        "вересень": 22, "жовтень": 22, "листопад": 20, "грудень": 20
    };

    const monthSelect = document.getElementById('monthSelect');
    for (const month in monthData) {
        let option = document.createElement('option');
        option.value = month;
        option.text = month.charAt(0).toUpperCase() + month.slice(1);
        monthSelect.appendChild(option);
    }
    monthSelect.value = "жовтень";

    function calculateSalary() {
        const selectedMonth = monthSelect.value;
        const workDays = monthData[selectedMonth];

        const minSalary = 4806.00;
        const nightTariff = Math.round(((minSalary / (workDays * 8)) * 0.20) * 100) / 100;

        const baseSalary = parseFloat(document.getElementById('baseSalary').value) || 0;
        const tenureBonus = parseFloat(document.getElementById('tenureSelect').value) || 0;
        const bonusPct = parseFloat(document.getElementById('bonusPctSelect').value) || 0;
        
        const morningShifts = parseInt(document.getElementById('morningShifts').value) || 0;
        const nightShifts = parseInt(document.getElementById('nightShifts').value) || 0;
        const weekendDays = parseInt(document.getElementById('weekendDays').value) || 0;
        const overtimeDays = parseFloat(document.getElementById('overtimeDays').value) || 0;

        const ppkActive = document.getElementById('ppkSelect').value === 'yes';
        const insuranceActive = document.getElementById('insuranceSelect').value === 'yes';

        const totalBase = baseSalary + tenureBonus;
        const bonusAmount = totalBase * (bonusPct / 100);

        const morningNightPay = Math.round((morningShifts * (10 / 60) * nightTariff) * 100) / 100;
        const nightPay = (nightShifts * 8 * nightTariff) + (nightShifts * 30);
        const totalNightPay = morningNightPay + nightPay;

        const weekendPay = weekendDays * 100;
        const overtimePay = Math.round(((totalBase / workDays) * 2 * overtimeDays) * 100) / 100;

        // Брутто (без прання) є базою для ZUS та податків
        const gross = totalBase + bonusAmount + totalNightPay + weekendPay + overtimePay;

        const zus = gross * 0.1371; 
        const healthBase = gross - zus;
        const nfz = Math.round((healthBase * 0.09) * 100) / 100;

        const ppkEmployee = ppkActive ? (gross * 0.02) : 0;

        // Податкова база (KUP = 300) округлюється до цілого
        const kup = 300.00;
        const pitBase = Math.round(Math.max(0, healthBase - kup));
        
        let nominalPit = (pitBase * 0.12) - 300.00;
        const benefitExpense = 54.00;
        
        // Fiege округлює номінальний податок і тільки потім додає 54 zł
        let pit = Math.round(nominalPit) + benefitExpense;
        pit = Math.max(0, pit);

        const insuranceDeduction = insuranceActive ? 36.70 : 0;
        const benefitDeduction = 30.25;
        
        // Прання (13 zł) повністю звільнене від податків і додається до виплати
        const laundryBonus = 13.00;

        // Фінальне Нетто
        const net = gross - zus - nfz - pit - ppkEmployee - insuranceDeduction - benefitDeduction + laundryBonus;

        document.getElementById('grossResult').innerText = gross.toFixed(2) + ' zł';
        document.getElementById('netResult').innerText = net.toFixed(2) + ' zł';
    }

    calculateSalary();
</script>

</body>
</html>
